[project]
name = "labtasker-workspace"
version = "2.0.1"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/labtasker",
  "packages/labtasker-client",
  "packages/labtasker-server",
]

[dependency-groups]
dev = [
  "hypothesis>=6.125,<7",
  "mike @ git+https://github.com/squidfunk/mike.git@0f62791256ebeba60d20d2f1d8fe6ec3b7d1e2b3",
  "mypy>=1.14,<2",
  "pre-commit>=4.6,<5",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "pytest-timeout>=2.3,<3",
  "ruff>=0.11,<1",
  "zensical==0.0.56",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
timeout = 30
markers = [
  "distributed_integration: real torchrun and Accelerate launcher integration",
]

[tool.coverage.run]
branch = true
source = ["labtasker", "labtasker_server"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"docs/snippets/**/*.py" = ["F821"]

[tool.ruff.lint.isort]
known-first-party = ["labtasker", "labtasker_server"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["labtasker.TaskArg", "labtasker.binding.TaskArg"]

[tool.ruff.format]
exclude = ["docs/**/*.md"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = [
  "packages/labtasker-client/src",
  "packages/labtasker-server/src",
]
plugins = ["pydantic.mypy"]
