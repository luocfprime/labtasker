name: Documentation

on:
  push:
    branches:
      - main
      - v2
    tags:
      - "v[0-9]*"
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "pyproject.toml"
      - "uv.lock"
      - "zensical.toml"

concurrency:
  group: documentation
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --all-packages --group dev --frozen
      - name: Configure Git author
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Deploy development documentation
        if: github.ref_type == 'branch'
        run: uv run mike deploy --push --update-aliases dev
      - name: Deploy release documentation
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          docs_version="${RELEASE_TAG#v}"
          uv run python .agents/skills/release/scripts/set_version.py --check "$docs_version"
          uv run mike deploy --push --update-aliases "$docs_version" latest
          uv run mike set-default --push latest
