name: Publish to PyPI

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --all-packages --group dev --frozen
      - name: Verify release tag and version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$RELEASE_TAG" in
            v*) release_version="${RELEASE_TAG#v}" ;;
            *) echo "Release tag must start with v: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          uv run python .agents/skills/release/scripts/set_version.py --check "$release_version"
          echo "EXPECTED_VERSION=$release_version" >> "$GITHUB_ENV"
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy packages/labtasker-client/src packages/labtasker-server/src
      - run: uv run pytest
      - name: Test the Client on Python 3.10 with latest allowed dependencies
        run: >-
          uv run python tests/compatibility/check_client_dependencies.py
          --profile latest --python 3.10
      - name: Check previous released Client compatibility
        run: uv run python tests/compatibility/check_previous_client.py --client-version 2.1.0
      - run: uv run zensical build --clean
      - run: uv build --all-packages
      - name: Verify release distributions
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["EXPECTED_VERSION"]
          expected = {
              f"labtasker-{version}-py3-none-any.whl",
              f"labtasker-{version}.tar.gz",
              f"labtasker_client-{version}-py3-none-any.whl",
              f"labtasker_client-{version}.tar.gz",
              f"labtasker_server-{version}-py3-none-any.whl",
              f"labtasker_server-{version}.tar.gz",
          }
          actual = {
              path.name
              for path in Path("dist").iterdir()
              if path.suffix == ".whl" or path.name.endswith(".tar.gz")
          }
          if actual != expected:
              raise SystemExit(
                  f"release distributions differ: expected {sorted(expected)}, found {sorted(actual)}"
              )
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package smoke test (Python ${{ matrix.python }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist/
      - name: Smoke-test release wheels
        env:
          EXPECTED_VERSION: ${{ github.event.release.tag_name }}
        run: |
          client_smoke_dir=$(mktemp -d)
          server_smoke_dir=$(mktemp -d)
          full_smoke_dir=$(mktemp -d)
          expected_version="${EXPECTED_VERSION#v}"
          client_wheel="dist/labtasker_client-${expected_version}-py3-none-any.whl"
          server_wheel="dist/labtasker_server-${expected_version}-py3-none-any.whl"
          metapackage_wheel="dist/labtasker-${expected_version}-py3-none-any.whl"
          uv venv --no-project --python "${{ matrix.python }}" "$client_smoke_dir"
          uv venv --no-project --python "${{ matrix.python }}" "$server_smoke_dir"
          uv venv --no-project --python "${{ matrix.python }}" "$full_smoke_dir"
          uv pip install --python "$client_smoke_dir/bin/python" "$client_wheel"
          uv pip install --python "$server_smoke_dir/bin/python" "$server_wheel"
          uv pip install --python "$full_smoke_dir/bin/python" \
            "$metapackage_wheel" "$client_wheel" "$server_wheel"
          EXPECTED_VERSION="$expected_version" "$client_smoke_dir/bin/python" - <<'PY'
          import importlib.metadata
          import importlib.util
          import os
          import labtasker

          version = os.environ["EXPECTED_VERSION"]
          assert importlib.metadata.version("labtasker-client") == version
          assert labtasker.__version__ == version
          assert importlib.util.find_spec("labtasker_server") is None
          assert importlib.util.find_spec("fastapi") is None
          PY
          EXPECTED_VERSION="$expected_version" "$server_smoke_dir/bin/python" - <<'PY'
          import importlib.metadata
          import importlib.util
          import os
          import labtasker_server
          from labtasker_server.app import create_app

          version = os.environ["EXPECTED_VERSION"]
          assert importlib.metadata.version("labtasker-server") == version
          assert labtasker_server.__version__ == version
          assert callable(create_app)
          assert importlib.util.find_spec("labtasker") is None
          PY
          EXPECTED_VERSION="$expected_version" "$full_smoke_dir/bin/python" - <<'PY'
          import importlib.metadata
          import os
          import labtasker
          import labtasker_server

          version = os.environ["EXPECTED_VERSION"]
          assert importlib.metadata.version("labtasker") == version
          assert importlib.metadata.version("labtasker-client") == version
          assert importlib.metadata.version("labtasker-server") == version
          assert labtasker.__version__ == labtasker_server.__version__ == version
          PY
          "$client_smoke_dir/bin/labtasker" --help
          "$server_smoke_dir/bin/labtasker-server" --help
          "$full_smoke_dir/bin/labtasker" --help
          "$full_smoke_dir/bin/labtasker-server" --help

  client-minimum-dependencies:
    name: Client minimum dependencies (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Test the Client with minimum dependencies
        run: >-
          uv run --no-project --python 3.11 python
          tests/compatibility/check_client_dependencies.py
          --profile minimum --python "${{ matrix.python }}"

  server-minimum-dependencies:
    name: Server minimum dependencies (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Test the Server with minimum dependencies
        run: >-
          uv run --no-project --python 3.11 python
          tests/compatibility/check_server_minimum.py
          --python "${{ matrix.python }}"

  distributed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --all-packages --group dev --frozen
      - run: uv pip install "torch>=2.4" "accelerate>=1,<2"
      - run: uv run --no-sync pytest -m distributed_integration

  publish-client:
    runs-on: ubuntu-latest
    needs:
      - build
      - client-minimum-dependencies
      - distributed
      - package
      - server-minimum-dependencies
    environment: pypi-client
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist/
      - name: Stage Client distributions
        run: |
          mkdir dist-client
          cp dist/labtasker_client-*.whl dist/labtasker_client-*.tar.gz dist-client/
      - name: Publish Client distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-client/
          skip-existing: true

  publish-server:
    runs-on: ubuntu-latest
    needs:
      - build
      - distributed
      - publish-client
    environment: pypi-server
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist/
      - name: Stage Server distributions
        run: |
          mkdir dist-server
          cp dist/labtasker_server-*.whl dist/labtasker_server-*.tar.gz dist-server/
      - name: Publish Server distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-server/
          skip-existing: true

  publish-metapackage:
    runs-on: ubuntu-latest
    needs:
      - build
      - distributed
      - publish-server
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist/
      - name: Stage metapackage distributions
        run: |
          mkdir dist-metapackage
          cp dist/labtasker-*.whl dist/labtasker-*.tar.gz dist-metapackage/
      - name: Publish metapackage distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-metapackage/
          skip-existing: true
