name: CI

on:
  pull_request:
  push:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages --group dev --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy packages/labtasker-client/src packages/labtasker-server/src
      - run: uv run zensical build --clean

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages --group dev --frozen
      - run: uv run pytest -m 'not distributed_integration'
      - name: Check previous released Client compatibility
        if: matrix.python == '3.11'
        run: uv run python tests/compatibility/check_previous_client.py --client-version 2.1.0

  client-minimum-dependencies:
    name: Client minimum dependencies (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Test the Client with minimum dependencies
        run: >-
          uv run --no-project --python 3.11 python
          tests/compatibility/check_client_dependencies.py
          --profile minimum --python "${{ matrix.python }}"

  server-minimum-dependencies:
    name: Server minimum dependencies (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Test the Server with minimum dependencies
        run: >-
          uv run --no-project --python 3.11 python
          tests/compatibility/check_server_minimum.py
          --python "${{ matrix.python }}"

  client-python310-latest:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Test the Client on Python 3.10 with latest allowed dependencies
        run: >-
          uv run --no-project --python 3.11 python
          tests/compatibility/check_client_dependencies.py
          --profile latest --python 3.10

  build:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv build --all-packages
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  macos-regressions:
    runs-on: macos-latest
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages --group dev --frozen
      - name: Check database ownership, local daemon, and Worker processes
        run: >-
          uv run pytest tests/server/test_database.py tests/server/test_server_cli.py
          tests/client/test_local.py tests/e2e/test_local_mode.py tests/client/test_tee.py
          tests/client/test_command_worker.py
          tests/server/test_http_foundation.py::test_shutdown_keeps_ownership_until_background_database_command_finishes
          tests/test_workspace.py::test_worker_tee_fork_child_does_not_inherit_active_run_log

  package:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/
      - name: Smoke-test independent wheels
        run: |
          client_smoke_dir=$(mktemp -d)
          server_smoke_dir=$(mktemp -d)
          full_smoke_dir=$(mktemp -d)
          export EXPECTED_VERSION=$(uv run --no-project --python 3.11 python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          client_wheel=$(find dist -maxdepth 1 -name 'labtasker_client-*.whl' -print -quit)
          server_wheel=$(find dist -maxdepth 1 -name 'labtasker_server-*.whl' -print -quit)
          metapackage_wheel=$(find dist -maxdepth 1 -name 'labtasker-*.whl' ! -name 'labtasker_client-*' ! -name 'labtasker_server-*' -print -quit)
          uv venv --no-project --python "$UV_PYTHON" "$client_smoke_dir"
          uv venv --no-project --python "$UV_PYTHON" "$server_smoke_dir"
          uv venv --no-project --python "$UV_PYTHON" "$full_smoke_dir"
          uv pip install --python "$client_smoke_dir/bin/python" "$client_wheel"
          uv pip install --python "$server_smoke_dir/bin/python" "$server_wheel"
          uv pip install --python "$full_smoke_dir/bin/python" \
            "$metapackage_wheel" "$client_wheel" "$server_wheel"
          "$client_smoke_dir/bin/python" - <<'PY'
          import importlib.util
          import os
          import labtasker
          assert labtasker.__version__ == os.environ["EXPECTED_VERSION"]
          assert importlib.util.find_spec("labtasker_server") is None
          assert importlib.util.find_spec("fastapi") is None
          PY
          "$server_smoke_dir/bin/python" - <<'PY'
          import importlib.util
          import os
          import labtasker_server
          from labtasker_server.app import create_app
          assert labtasker_server.__version__ == os.environ["EXPECTED_VERSION"]
          assert callable(create_app)
          assert importlib.util.find_spec("labtasker") is None
          PY
          "$full_smoke_dir/bin/python" - <<'PY'
          import importlib.metadata
          import os
          import labtasker
          import labtasker_server
          version = os.environ["EXPECTED_VERSION"]
          assert importlib.metadata.version("labtasker") == version
          assert labtasker.__version__ == labtasker_server.__version__ == version
          PY
          "$client_smoke_dir/bin/labtasker" --help
          "$server_smoke_dir/bin/labtasker-server" --help
          "$full_smoke_dir/bin/labtasker" --help
          "$full_smoke_dir/bin/labtasker-server" --help
