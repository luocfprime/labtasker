name: CI

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --group dev --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy packages/labtasker-client/src packages/labtasker-server/src
      - run: uv run pytest
      - run: uv run zensical build --clean
      - run: uv build --all-packages
      - name: Smoke-test independent wheels
        run: |
          client_smoke_dir=$(mktemp -d)
          server_smoke_dir=$(mktemp -d)
          export EXPECTED_VERSION=$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          client_wheel=$(find dist -maxdepth 1 -name 'labtasker-*.whl' -print -quit)
          server_wheel=$(find dist -maxdepth 1 -name 'labtasker_server-*.whl' -print -quit)
          uv venv "$client_smoke_dir"
          uv venv "$server_smoke_dir"
          uv pip install --python "$client_smoke_dir/bin/python" "$client_wheel"
          uv pip install --python "$server_smoke_dir/bin/python" "$server_wheel"
          "$client_smoke_dir/bin/python" - <<'PY'
          import importlib.util
          import os
          import labtasker
          assert labtasker.__version__ == os.environ["EXPECTED_VERSION"]
          assert importlib.util.find_spec("labtasker_server") is None
          assert importlib.util.find_spec("fastapi") is None
          PY
          "$server_smoke_dir/bin/python" - <<'PY'
          import importlib.util
          import os
          import labtasker_server
          from labtasker_server.app import create_app
          assert labtasker_server.__version__ == os.environ["EXPECTED_VERSION"]
          assert callable(create_app)
          assert importlib.util.find_spec("labtasker") is None
          PY
          "$client_smoke_dir/bin/labtasker" --help
          "$server_smoke_dir/bin/labtasker-server" --help
