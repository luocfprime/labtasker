[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "labtasker-server"
version = "2.4.1"
description = "SQLite/FastAPI server for parallel model inference and evaluation"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "lcf", email = "luocfprime@gmail.com" }]
dependencies = [
  "alembic>=1.19.2,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3; python_version < '3.14'",
  "pydantic>=2.12,<3; python_version >= '3.14'",
  "sqlalchemy>=2.0,<3; python_version < '3.13'",
  "sqlalchemy>=2.0.31,<3; python_version >= '3.13' and python_version < '3.14'",
  "sqlalchemy>=2.0.41,<3; python_version >= '3.14'",
  "typer>=0.16,<1",
  "uvicorn>=0.34,<1",
]

[project.urls]
Homepage = "https://github.com/luocfprime/labtasker"
Repository = "https://github.com/luocfprime/labtasker.git"

[project.scripts]
labtasker-server = "labtasker_server.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/labtasker_server"]
