[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "labtasker"
version = "2.0.0"
description = "Complete Labtasker installation with Client and local Server"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "lcf", email = "luocfprime@gmail.com" }]
dependencies = [
  "labtasker-client==2.0.0",
  "labtasker-server==2.0.0",
]

[tool.uv.sources]
labtasker-client = { workspace = true }
labtasker-server = { workspace = true }

[project.urls]
Homepage = "https://github.com/luocfprime/labtasker"
Repository = "https://github.com/luocfprime/labtasker.git"

[tool.hatch.build.targets.wheel]
bypass-selection = true
