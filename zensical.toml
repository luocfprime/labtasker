[project]
site_name = "Labtasker"
site_description = "Run independent ML experiments in parallel without writing your own task infrastructure."
site_author = "Labtasker contributors"
site_url = "https://luocfprime.github.io/labtasker/"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/luocfprime/labtasker"
repo_name = "luocfprime/labtasker"
edit_uri = "edit/v2/docs/"
copyright = "Apache-2.0"
nav = [
  { "Overview" = "index.md" },
  { "Why Labtasker?" = "why-labtasker.md" },
  { "Get started" = "getting-started.md" },
  { "Core model" = "concepts.md" },
  { "Examples" = [
    { "Inference and evaluation" = "inference-evaluation.md" },
    { "Embodied AI: RoboTwin evaluation (StarVLA codebase)" = "case-studies/starvla-robotwin.md" },
  ] },
  { "Workers" = [
    "workers/python.md",
    "workers/command.md",
    "workers/distributed.md",
  ] },
  { "Using Labtasker" = [
    "guides/tasks.md",
    "guides/query.md",
    "guides/failure-recovery.md",
    "guides/agent-skill.md",
  ] },
  { "Reference" = [
    "reference/configuration.md",
    "reference/python-api.md",
    "reference/cli.md",
    "reference/http-api.md",
    "reference/specification.md",
  ] },
  { "Development" = "development.md" },
]

[project.extra.version]
provider = "mike"
alias = true

[project.markdown_extensions]
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.snippets.base_path = "docs"
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true

[project.theme]
logo = "assets/favicon.png"
favicon = "assets/favicon.png"
features = [
  "content.tabs.link",
]
