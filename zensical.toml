[project]
site_name = "Labtasker"
site_description = "Run independent ML experiments in parallel without writing your own task infrastructure."
site_author = "Labtasker contributors"
site_url = "https://luocfprime.github.io/labtasker/"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/luocfprime/labtasker"
repo_name = "luocfprime/labtasker"
edit_uri = "edit/main/docs/"
copyright = "Apache-2.0"
nav = [
  { "Overview" = "index.md" },
  { "Tutorial" = [
    { "Run your first experiment" = "getting-started.md" },
    { "Run the tested demo" = "demo.md" },
  ] },
  { "Concepts" = [
    { "Why Labtasker?" = "why-labtasker.md" },
    { "How Labtasker works" = "concepts.md" },
  ] },
  { "Guides" = [
    { "Inference and evaluation" = "inference-evaluation.md" },
    { "Python Workers" = "workers/python.md" },
    { "Command Workers" = "workers/command.md" },
    { "Distributed launchers" = "workers/distributed.md" },
    { "Manage Tasks" = "guides/tasks.md" },
    { "Query Tasks" = "guides/query.md" },
    { "Recover from failures" = "guides/failure-recovery.md" },
    { "Use the Agent Skill" = "guides/agent-skill.md" },
  ] },
  { "Case studies" = [
    { "RoboTwin evaluation with StarVLA" = "case-studies/starvla-robotwin.md" },
  ] },
  { "Reference" = [
    { "Configuration" = "reference/configuration.md" },
    { "Python API" = "reference/python-api.md" },
    { "CLI" = "reference/cli.md" },
    { "HTTP API" = "reference/http-api.md" },
    { "Specification" = "reference/specification.md" },
  ] },
  { "Development" = "development.md" },
]

[project.extra.version]
provider = "mike"
alias = true

[project.markdown_extensions]
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.snippets.base_path = ["docs", "."]
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true

[project.theme]
logo = "assets/favicon.png"
favicon = "assets/favicon.png"
features = [
  "content.tabs.link",
]
